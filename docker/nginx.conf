# Served by nginx-unprivileged (non-root, port 8080).
upstream phishguard_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 16k;  # scan requests are tiny JSON bodies

    # The inline-script hash matches the theme bootstrap in index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Wy99wQ7ReC4yFrq2KAavnyxf20METIhjX2TkRO6z3SI='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://phishguard_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;  # a full scan can take up to ~40 s
        proxy_send_timeout 30s;
    }

    # API docs need inline scripts and a CDN; relax CSP only there.
    location ~ ^/api/(docs|openapi\.json)$ {
        proxy_pass http://phishguard_api;
        add_header Content-Security-Policy "" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;  # SPA routing (404 page handled client-side)
    }
}
