<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04121F" />
    <meta name="description" content="PhishGuard - khung học máy so sánh quét URL và cho biết website có lừa đảo hay không, kèm bằng chứng đằng sau kết luận." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>PhishGuard - Liên kết này có phải là bẫy không?</title>
    <script>
      try { const t = localStorage.getItem("pg-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PhishGuard cần JavaScript để quét liên kết.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
